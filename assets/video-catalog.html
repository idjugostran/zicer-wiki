    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h) return `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
    return `${m}:${String(sec).padStart(2, "0")}`;
  }

  function fmtViews(v) {
    return v.toLocaleString("ru-RU");
  }

  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  let state = { sortKey: "rank", sortDir: 1, filter: "all", query: "" };

  const tbody = document.getElementById("tbody");
  const emptyState = document.getElementById("emptyState");
  const countLine = document.getElementById("countLine");

  function computeStats() {
    const total = DATA.length;
    const done = DATA.filter(r => r.p).length;
    document.getElementById("statTotal").textContent = total;
    document.getElementById("statDone").textContent = done;
    document.getElementById("statPending").textContent = total - done;
  }

  function applyAndRender() {
    let rows = DATA;
    if (state.filter === "done") rows = rows.filter(r => r.p);
    if (state.filter === "pending") rows = rows.filter(r => !r.p);
    if (state.query) {
      const q = state.query.toLowerCase();
      rows = rows.filter(r => r.t.toLowerCase().includes(q) || r.id.toLowerCase().includes(q));
    }

    const key = state.sortKey;
    const dir = state.sortDir;
    rows = rows.slice().sort((a, b) => {
      let av = a[key], bv = b[key];
      if (key === "p") { av = av ? 1 : 0; bv = bv ? 1 : 0; }
      if (typeof av === "string") {
        const c = av.localeCompare(bv, "ru");
        return dir * c;
      }
      return dir * ((av ?? -1) - (bv ?? -1));
    });

    countLine.textContent = `Показано ${rows.length} из ${DATA.length}`;
    emptyState.hidden = rows.length !== 0;

    const frag = document.createDocumentFragment();
    for (const r of rows) {
      const tr = document.createElement("tr");
      const pct = Math.max(2, Math.round((r.v / maxViews) * 100));
      tr.innerHTML = `
        <td class="rank">${r.rank}</td>
        <td>${r.p
          ? '<span class="status-pill done"><span class="dot"></span>в вики</span>'
          : '<span class="status-pill pending"><span class="dot"></span>осталось</span>'}</td>
        <td class="title-cell"><span class="t" title="${escapeHtml(r.t)}">${escapeHtml(r.t)}</span></td>
        <td class="views-cell">
          <div class="views-wrap">
            <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
            <span>${fmtViews(r.v)}</span>
          </div>
        </td>
        <td class="dur-cell num">${fmtDuration(r.d)}</td>
        <td class="id-cell">${r.id}</td>
      `;
      frag.appendChild(tr);
    }
    tbody.innerHTML = "";
    tbody.appendChild(frag);
  }

  document.querySelectorAll("th button[data-sort]").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.sort;
      if (state.sortKey === key) {
        state.sortDir *= -1;
      } else {
        state.sortKey = key;
        state.sortDir = (key === "t" || key === "id") ? 1 : -1;
      }
      document.querySelectorAll("th").forEach(th => th.classList.remove("sorted"));
      btn.closest("th").classList.add("sorted");
      btn.querySelector(".arrow").textContent = state.sortDir === 1 ? "▴" : "▾";
      applyAndRender();
    });
  });
  document.querySelector('th button[data-sort="v"]').closest("th").classList.add("sorted");

  document.querySelectorAll(".filters button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.filter = btn.dataset.filter;
      applyAndRender();
    });
  });

  document.getElementById("searchInput").addEventListener("input", (e) => {
    state.query = e.target.value.trim();
    applyAndRender();
  });

  computeStats();
  applyAndRender();
</script>
